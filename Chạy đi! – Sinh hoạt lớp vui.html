<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">

<title>Chạy đi! – Sinh hoạt lớp vui</title>
<style>
:root{--bg:#fff4dc;--fg:#1f2937;--card:#fff;--mut:#6b7280;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111827;--fg:#f9fafb;--card:#1f2937;--mut:#9ca3af;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111827;--fg:#f9fafb;--card:#1f2937;--mut:#9ca3af;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Roboto,sans-serif;font-size:clamp(15px,2.8vmin,28px)}
#app{min-height:100%;display:flex;flex-direction:column;gap:1.5vmin;padding:2vmin;box-sizing:border-box}
h1{margin:0;font-size:clamp(28px,8vmin,90px);text-align:center;line-height:1.1}
h1 small{display:block;font-size:clamp(14px,2.8vmin,28px);color:var(--mut);font-weight:600;margin-top:.5vmin}
h3{margin:0 0 1vmin}
button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:2vmin;padding:1.3vmin 2.6vmin;color:#fff;background:#7c3aed}
button.big{font-size:clamp(20px,5vmin,56px);padding:2vmin;width:100%;background:#16a34a}
.c{background:var(--card);border-radius:2.5vmin;padding:2vmin}
.chip{background:var(--bg);color:var(--fg);outline:.5vmin solid transparent;margin:.5vmin}
.chip.on{outline-color:#7c3aed;background:#ede9fe;color:#4c1d95}
.hd{display:flex;justify-content:space-between;align-items:center;gap:1vmin;font-weight:800}
.q{background:var(--card);border-radius:3vmin;padding:2.5vmin;font-size:clamp(20px,5.4vmin,64px);font-weight:800;text-align:center}
.g{display:grid;grid-template-columns:1fr 1fr;gap:1.5vmin;flex:1}
.t{border-radius:3vmin;color:#fff;font-weight:800;display:flex;align-items:center;gap:2vmin;padding:2vmin;font-size:clamp(16px,4.2vmin,48px);min-height:12vh;transition:.3s}
.t b{font-size:clamp(28px,9vmin,96px)}
.t.dim{opacity:.2}.t.ok{outline:1.2vmin solid #fff;transform:scale(1.04);box-shadow:0 0 6vmin gold}
.tm{font-size:clamp(48px,16vmin,200px);font-weight:900;text-align:center;line-height:1;color:#dc2626}
.st{text-align:center;font-weight:800;font-size:clamp(18px,4.5vmin,50px)}
.ex{background:#fef9c3;color:#713f12;border-radius:2vmin;padding:2vmin;font-size:clamp(15px,3.4vmin,36px)}
.tc{display:flex;flex-wrap:wrap;gap:1vmin;justify-content:center;align-items:center}
.tc span{background:var(--card);border-radius:2vmin;padding:1vmin 1.6vmin}
textarea{width:100%;min-height:30vh;box-sizing:border-box;font:inherit;border-radius:2vmin;padding:1.5vmin;background:var(--bg);color:var(--fg)}
li{margin:.8vmin 0}
</style></head><body><div id="app"></div>

const P=[
{id:'bien',n:'Biển & nước',e:'🌊',q:[

["Khi đi thuyền, đi phà, em nên mặc áo phao vào lúc nào?",["Khi sóng to mới mặc","Ngay từ khi bước lên phương tiện","Chỉ khi ra xa bờ","Không cần nếu biết bơi"],1,"Tai nạn xảy ra rất nhanh, nên áo phao phải mặc đúng và mặc ngay từ đầu, kể cả khi biết bơi."],

["Cờ màu đỏ cắm ở bãi biển có ý nghĩa gì?",["Bãi biển an toàn","Nguy hiểm, không xuống tắm","Có bán đồ ăn","Có trò chơi"],1,"Cờ đỏ là cảnh báo sóng lớn, dòng chảy mạnh. Hãy tuân theo biển báo và nhân viên cứu hộ."],

["Bị chuột rút khi đang bơi, em nên làm gì?",["Hoảng sợ bơi thật nhanh","Bình tĩnh nổi ngửa, vẫy tay kêu cứu","Lặn xuống đáy","Im lặng chịu đựng"],1,"Nổi ngửa để giữ sức, kéo giãn cơ bị co và ra hiệu cầu cứu."]]},
{id:'gt',n:'An toàn giao thông',e:'🚦',q:[
["Ngồi sau xe máy có cần đội mũ bảo hiểm không?",["Không cần, vì đi gần","Chỉ cần khi ra đường lớn","Luôn phải đội và cài quai đúng cách","Chỉ người lái đội"],2,"Mũ bảo hiểm cài quai chắc chắn giúp giảm nguy cơ chấn thương sọ não. Người lái và người ngồi sau đều phải đội."],
["Đèn tín hiệu giao thông màu đỏ có nghĩa là gì?",["Đi nhanh lên","Dừng lại trước vạch dừng","Được rẽ tự do","Bấm còi"],1,"Đèn đỏ: dừng lại trước vạch dừng, chờ đèn xanh mới đi tiếp."],
["Đi xe đạp trên đường, em nên đi ở phía nào?",["Bên phải theo chiều đi, sát lề đường","Giữa đường","Bên trái đường","Tùy ý"],0,"Đi bên phải theo chiều đi, sát mép đường, không dàn hàng ngang, không phóng nhanh vượt ẩu."],

{id:'bn',n:'Bạn bè & bắt nạt',e:'🤝',q:[

{id:'mang',n:'An toàn mạng',e:'📱',q:[

["Mật khẩu nào an toàn hơn cả?",["123456","Tên và ngày sinh của em","Chuỗi dài gồm chữ hoa, chữ thường, số và ký hiệu","Dùng chung một mật khẩu cho mọi tài khoản"],2,"Mật khẩu dài, kết hợp nhiều loại ký tự và mỗi tài khoản một mật khẩu khác nhau."],

{id:'xanh',n:'Sống xanh – Biển sạch',e:'♻️',q:[

["Quy tắc 3R gồm: Giảm thiểu – Tái sử dụng – … ?",["Tái chế","Tái đầu tư","Tái xuất","Tái hiện"],0,"3R: Reduce (giảm thiểu), Reuse (tái sử dụng), Recycle (tái chế)."],

{id:'sk',n:'Sức khỏe & tinh thần',e:'💪',q:[

{id:'ky',n:'Ứng phó khẩn cấp',e:'🆘',q:[

{id:'hoc',n:'Học tập & thói quen',e:'📚',q:[

];
const CH=["🦘 Nhảy tại chỗ 10 cái, cả lớp đếm to!","🦆 Đi như vịt quanh lớp trong 10 giây!","🧘 Hít vào 4 giây, thở ra 6 giây. Làm 3 lần!","🤝 Bắt tay và khen một bạn gần nhất một câu!","🕺 Nhảy tự do 15 giây!","🙌 Vỗ tay theo nhịp 1-2-3, nhanh dần lên!","🐢 Đứng một chân, ai đứng lâu nhất là quán quân thăng bằng!","🐒 Cả lớp bắt chước một con vật mà thầy cô chỉ định!"];
const TM=[["🦁","Sư tử"],["🐬","Cá heo"],["🐢","Rùa biển"],["🦅","Đại bàng"]];
const COL=['#ef4444','#3b82f6','#22c55e','#f59e0b'],L='ABCD';
let S={s:'home',pk:'all',tn:0,sec:10,q:[],i:0,ph:'q',t:0,sc:[],cu:[],ch:'',m:''},T=null,ac=null,CUS=[],RAW='';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function snd(f,d,ty,v){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.type=ty||'sine';o.frequency.value=f;g.gain.value=v||.15;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function tune(a){a.forEach((f,i)=>setTimeout(()=>snd(f,.25,'triangle'),i*150))}
function load(){try{const d=JSON.parse(localStorage.getItem('sh_cus'));CUS=d.r||[];RAW=d.t||''}catch(e){CUS=[];RAW=''}}
function persist(){try{localStorage.setItem('sh_cus',JSON.stringify({r:CUS,t:RAW}))}catch(e){}}
function parse(txt){const r=[];String(txt).split('\n').forEach(l=>{const p=l.split('|').map(x=>x.trim());for(let j=3;j<=5&&j<p.length;j++){if(/^[A-Da-d]$/.test(p[j])){const a=p[j].toUpperCase().charCodeAt(0)-65,o=p.slice(1,j);if(p[0]&&a<o.length&&o.every(x=>x)){r.push([p[0],o,a,p[j+1]||'']);}break}}});return r}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pool(){if(S.pk==='cus'&&CUS.length)return shuf(CUS);if(S.pk==='all'||S.pk==='cus')return shuf([].concat(...P.map(p=>p.q))).slice(0,10);const p=P.find(x=>x.id===S.pk);return shuf(p.q)}
function set(k,v){S[k]=v;render()}
function home(){clearInterval(T);S.s='home';render()}
function edit(){S.s='edit';S.m='';render()}
function start(){const q=pool();if(!q.length)return;clearInterval(T);S.q=q;S.i=0;S.ph='q';S.sc=Array(S.tn).fill(0);S.cu=Array(S.tn).fill(0);S.s='game';try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}snd(660,.2);render()}
function startRun(){S.ph='run';S.t=S.sec;snd(880,.2);clearInterval(T);T=setInterval(tick,1000);render()}
function tick(){S.t--;if(S.t>0){snd(S.t<=3?880:520,.1)}else{clearInterval(T);S.t=0;S.ph='frz';snd(200,.6,'sawtooth')}render()}
function stopEarly(){clearInterval(T);S.ph='frz';snd(200,.6,'sawtooth');render()}
function reveal(){S.ph='rev';tune([523,659,784]);render()}
function adj(k,d){S.cu[k]=Math.max(0,S.cu[k]+d);snd(600,.08);render()}
function next(){S.sc=S.sc.map((v,k)=>v+S.cu[k]);S.cu=S.cu.map(()=>0);S.i++;if(S.i>=S.q.length){S.s='end';tune([523,659,784,1047])}else if(S.i%3===0){S.ph='ch';S.ch=CH[Math.floor(Math.random()*CH.length)];tune([392,523])}else S.ph='q';render()}
function afterCh(){S.ph='q';render()}
function saveEd(){const tx=$('tx').value;RAW=tx;if(!tx.trim()){CUS=[];persist();if(S.pk==='cus')S.pk='all';S.m='🗑️ Đã xóa bộ câu hỏi của lớp.';render();return}const r=parse(tx);if(!r.length){S.m='⚠️ Chưa có dòng nào hợp lệ. Xem ví dụ bên dưới.';render();return}CUS=r;persist();S.pk='cus';S.m='✅ Đã lưu '+r.length+' câu và đã chọn sẵn chủ đề “Của lớp mình”. Bấm “Về trang đầu” để chơi.';render()}
function score(){return S.tn?'<div class="tc">'+S.sc.map((v,k)=>`<span>${TM[k][0]} <b>${v}</b></span>`).join('')+'</div>':''}
function render(){
const a=$('app');
if(S.s==='home'){
const chips=[['all','🎲','Tổng hợp 10 câu']].concat(P.map(p=>[p.id,p.e,p.n]));if(CUS.length)chips.push(['cus','✏️','Của lớp mình ('+CUS.length+')']);
a.innerHTML=`<h1>🏃 CHẠY ĐI!<small>Sinh hoạt lớp vui – học bằng đôi chân</small></h1>
<div class="c"><h3>1. Chọn chủ đề</h3>${chips.map(c=>`<button class="chip ${S.pk===c[0]?'on':''}" onclick="set('pk','${c[0]}')">${c[1]} ${esc(c[2])}</button>`).join('')}</div>
<div class="c"><h3>2. Chia đội</h3>${[0,2,3,4].map(v=>`<button class="chip ${S.tn===v?'on':''}" onclick="set('tn',${v})">${v?v+' đội':'Cả lớp (không chia đội)'}</button>`).join('')}</div>
<div class="c"><h3>3. Thời gian chạy mỗi câu</h3>${[8,10,15].map(v=>`<button class="chip ${S.sec===v?'on':''}" onclick="set('sec',${v})">${v} giây</button>`).join('')}</div>
<button class="big" onclick="start()">▶ BẮT ĐẦU</button>
<button onclick="edit()">✏️ Tự soạn câu hỏi cho lớp mình</button>
<div class="c"><h3>📋 Cách chơi</h3><ol><li>Dán 4 tờ giấy <b>A, B, C, D</b> ở 4 góc lớp (A–B gần bảng, C–D cuối lớp; A, C bên trái). Câu Đúng/Sai: A = bên trái, B = bên phải.</li><li>Xoay điện thoại ngang, chiếu lên TV.</li><li>Đọc câu hỏi, bấm <b>CHẠY ĐI!</b>. Cả lớp chạy về góc mình chọn trước khi hết giờ.</li><li>Hết giờ cả lớp <b>đứng im</b>. Công bố đáp án và đọc lời giải thích.</li><li>Chia đội: sau mỗi câu bấm + cho số bạn trả lời đúng của mỗi đội.</li></ol></div>`;return}
if(S.s==='edit'){
a.innerHTML=`<h1>✏️ Câu hỏi của lớp mình</h1><div class="c"><p>Mỗi dòng một câu theo mẫu: <b>Câu hỏi | Đáp án A | Đáp án B | Đáp án C | Đáp án D | Đáp án đúng (chữ cái) | Giải thích</b><br>Chỉ có 2 đáp án (Đúng/Sai) thì viết: Câu hỏi | Đúng | Sai | B | Giải thích</p>
<textarea id="tx" placeholder="Giờ ra chơi em nên làm gì? | Chạy nhảy trong hành lang | Chơi ở sân trường | Trèo lan can | Ở lì trong lớp | B | Sân trường rộng và an toàn hơn hành lang.">${esc(RAW)}</textarea>
<p>${esc(S.m)}</p></div><button class="big" onclick="saveEd()">💾 Lưu câu hỏi</button><button onclick="home()">🏠 Về trang đầu</button>`;return}
if(S.s==='end'){
const rk=S.tn?S.sc.map((v,k)=>[v,k]).sort((x,y)=>y[0]-x[0]):[];
a.innerHTML=`<h1>🎉 HOÀN THÀNH!<small>Cả lớp đã vận động và học được ${S.q.length} điều bổ ích</small></h1>
${S.tn?`<div class="c"><h3>🏆 Bảng xếp hạng</h3>${rk.map((r,i)=>`<div class="st">${['🥇','🥈','🥉','🏅'][i]} ${TM[r[1]][0]} Đội ${TM[r[1]][1]}: ${r[0]} điểm</div>`).join('')}</div>`:''}
<div class="c"><h3>📌 Ghi nhớ hôm nay</h3><ul>${S.q.map(q=>`<li>${esc(q[3])}</li>`).join('')}</ul></div>
<button class="big" onclick="start()">🔁 Chơi lại</button><button onclick="home()">🏠 Về trang đầu</button>`;return}
const hd=`<div class="hd"><span>Câu ${Math.min(S.i+1,S.q.length)}/${S.q.length}</span>${score()}<button onclick="home()">✕</button></div>`;
if(S.ph==='ch'){
a.innerHTML=hd+`<div class="q">⚡ THỬ THÁCH VẬN ĐỘNG<br>${esc(S.ch)}</div><button class="big" onclick="afterCh()">▶ Tiếp tục câu ${S.i+1}</button>`;return}
const q=S.q[S.i],n=q[1].length,rev=S.ph==='rev';
let st='';
if(S.ph==='q')st=n===2?'Đọc to câu hỏi, rồi bấm CHẠY ĐI! A = bên trái, B = bên phải':'Đọc to câu hỏi, rồi bấm CHẠY ĐI!';
if(S.ph==='run')st=`<div class="tm">${S.t}</div>🏃 CHẠY VỀ GÓC EM CHỌN!`;
if(S.ph==='frz')st='❄️ ĐỨNG IM! Không đổi góc nữa!';
if(rev)st=`✅ Đáp án đúng: ${L[q[2]]}. ${esc(q[1][q[2]])}`;
const tl=q[1].map((o,k)=>{const c=n===2?COL[[2,1][k]]:COL[k];return `<div class="t ${rev?(k===q[2]?'ok':'dim'):''}" style="background:${c}"><b>${L[k]}</b><span>${esc(o)}</span></div>`}).join('');
let ctl='';
if(S.ph==='q')ctl=`<button class="big" onclick="startRun()">🏃 CHẠY ĐI! (${S.sec} giây)</button>`;
if(S.ph==='run')ctl=`<button class="big" style="background:#dc2626" onclick="stopEarly()">⏹ Dừng sớm</button>`;
if(S.ph==='frz')ctl=`<button class="big" onclick="reveal()">🎉 Công bố đáp án</button>`;
if(rev){ctl=`<div class="ex">💡 ${esc(q[3])}</div>`;
if(S.tn)ctl+=`<div class="c"><b>Số bạn trả lời đúng của mỗi đội:</b><div class="tc">${S.cu.map((v,k)=>`<span>${TM[k][0]} ${TM[k][1]} <button onclick="adj(${k},-1)">−</button> <b>${v}</b> <button onclick="adj(${k},1)">+</button></span>`).join('')}</div></div>`;
ctl+=`<button class="big" onclick="next()">${S.i+1>=S.q.length?'🏁 Xem kết quả':'▶ Câu tiếp'}</button>`}
a.innerHTML=hd+`<div class="q">${esc(q[0])}</div><div class="st">${st}</div><div class="g">${tl}</div>${ctl}`}
load();render();
</script></body></html>
